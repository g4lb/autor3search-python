[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autor3search"
version = "0.4.5"
description = "Autonomous AI-driven performance optimization for any Python repository"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Gal Be", email = "galevgi@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["autoresearch", "benchmark", "performance", "optimization", "pytest-benchmark", "ai-agent"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://autor3search.dev"
Repository = "https://github.com/autor3search/python"
Source = "https://github.com/autor3search/python"
Issues = "https://github.com/autor3search/python/issues"
Changelog = "https://github.com/autor3search/python/releases"

[project.scripts]
autor3search-python = "autor3search.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-benchmark>=4", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/autor3search"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real measurement, minutes not seconds"]
addopts = "-p no:benchmark"
